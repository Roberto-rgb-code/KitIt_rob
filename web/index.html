<!DOCTYPE html>
<html>
<head>
  <!--
    Si sirves tu app Flutter en una ruta distinta a la raíz, cambia el valor
    de href aquí abajo. Debe empezar y terminar con "/".
    Ejemplo: <base href="/subcarpeta/">
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="kitit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>kitit</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Este valor lo inyecta Flutter en build, no lo cambies
    var serviceWorkerVersion = "{{flutter_service_worker_version}}";
  </script>

  <!-- Google Maps JS API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyAtWc3gF7u8i7tiLCxuN5KoGxEf-a8FRKY&v=weekly&libraries=places"></script>

  <!-- Inicialización de Flutter -->
  <script src="flutter.js" defer></script>
</head>
<body>
  <script>
    window.addEventListener('load', function(ev) {
      _flutter.loader.loadEntrypoint({
        serviceWorker: {
          serviceWorkerVersion: serviceWorkerVersion,
        }
      }).then(function(engineInitializer) {
        return engineInitializer.initializeEngine();
      }).then(function(appRunner) {
        return appRunner.runApp();
      });
    });
  </script>
</body>
</html>
