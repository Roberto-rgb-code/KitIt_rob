name: kitit
description: A new Flutter project.

publish_to: 'none' # Prevent publishing to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.13.1
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  geocoding: ^4.0.0
  gsheets: ^0.5.0
  mysql_client: ^0.0.27
  flutter_speed_dial: ^7.0.0
  custom_info_window: ^1.0.1
  provider: ^6.1.5
  get: ^4.7.2
  syncfusion_flutter_charts: ^31.1.21
  flutter_launcher_icons: ^0.14.4
  introduction_screen: ^4.0.0
  shared_preferences: ^2.3.2
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  google_sign_in: ^6.2.1 

flutter_icons:
  android: "launcher_icon"
  image_path: "lib/icon/ExitoXY.png"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Overrides para corregir errores de compilación en Windows/Dart 3
dependency_overrides:
  win32: ^5.4.0
  typed_data: ^1.4.0
  ffi: ^2.1.2

flutter:
  uses-material-design: true
  assets:
    - lib/_img/

